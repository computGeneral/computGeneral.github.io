<script>
'use strict';
const DATA=JSON.parse(document.getElementById('progress-data').textContent);
const LABELS={running:'实际运行中',ready:'可推进',waiting:'等待依赖',decision:'🔴 待你裁决',verified:'阶段已验',unverified:'未复核'};
const STAGES={done:'已完成',current:'当前位置',planned:'规划',unknown:'待核验'};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
document.title=DATA.title;document.getElementById('snapshot').textContent='核对时间 '+DATA.updatedAt;document.getElementById('head').textContent=DATA.head;document.getElementById('notice').textContent=DATA.notice;
function progressTime(line){if(typeof line.progressAt!=='string'||!/^\d{4}-\d{2}-\d{2}T/.test(line.progressAt))return -Infinity;const t=Date.parse(line.progressAt);return Number.isFinite(t)?t:-Infinity}
const lines=DATA.lines.map((x,i)=>({...x,_order:i})).sort((a,b)=>{const ta=progressTime(a),tb=progressTime(b);return ta===tb?a._order-b._order:tb>ta?1:-1});let filter='all';let query='';
if(DATA.publicView){document.getElementById('head').parentElement.style.display='none'}
const specs=[['开发线',lines.length,'本页跟踪'],['实际运行',lines.filter(x=>x.status==='running').length,'仅计已验证进程'],['等待 / 待决策',lines.filter(x=>['waiting','decision'].includes(x.status)).length,'不等于整线停止'],['阶段已验',lines.filter(x=>x.status==='verified').length,'不是全线交付']];
for(const [name,n,caption]of specs){const box=el('div','stat');const text=el('div');text.append(el('div','',name),el('span','',caption));box.append(text,el('strong','',String(n)));document.getElementById('summary').append(box)}
for(const [id,label]of [['all','全部'],['running','运行中'],['ready','可推进'],['waiting','等依赖'],['decision','待裁决'],['verified','阶段已验'],['unverified','未复核']]){const b=el('button','filter'+(id==='all'?' active':''),label);b.type='button';b.dataset.filter=id;b.setAttribute('aria-pressed',id==='all');b.onclick=()=>{filter=id;document.querySelectorAll('.filter').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});render()};document.getElementById('filters').append(b)}
function makeTrack(line,label,subtitle,stages,basis,cls){
 const row=el('div','track-row '+(cls||''));const name=el('div','track-label',label);name.append(el('small','',subtitle));const body=el('div','track-content');const list=el('ol','roadmap');list.setAttribute('aria-label',line.name+' · '+label);
 for(const item of stages){const state=STAGES[item.state]?item.state:'unknown';const li=el('li','stage '+state);li.append(el('span','node'),el('span','',item.label),el('small','',STAGES[state]));if(item.detail)li.append(el('span','stage-detail',item.detail));if(!DATA.publicView){if(item.parallel)li.append(el('span','stage-parallel','并行：'+item.parallel));if(item.source)li.append(el('span','stage-source','来源：'+item.source))}list.append(li)}
 if(cls==='steps'){body.append(list)}else{const scroller=el('div','roadmap-scroll');scroller.setAttribute('tabindex','0');scroller.setAttribute('role','region');scroller.setAttribute('aria-label',line.name+' 完整规划；内容较长时可左右滚动，方向键移动，Home / End 到两端');scroller.append(list);scroller.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||scroller.scrollWidth<=scroller.clientWidth)return;let pos;if(event.key==='ArrowRight')pos=scroller.scrollLeft+168;else if(event.key==='ArrowLeft')pos=scroller.scrollLeft-168;else if(event.key==='Home')pos=0;else if(event.key==='End')pos=scroller.scrollWidth-scroller.clientWidth;else return;event.preventDefault();scroller.scrollLeft=pos});body.append(scroller);if(stages.length>6)name.append(el('span','scroll-hint','长路线可左右滚动'))}
 if(basis)body.append(el('p','basis',basis));row.append(name,body);return row
}
function card(line){
 const a=el('article','card');a.dataset.line=line.id;
 const h=el('div','card-head');const title=el('div','line-title');title.append(el('h2','',line.name));if(line.owner)title.append(el('div','owner','负责：'+line.owner));
 const status=el('div','head-status');const time=el('div','progress-time');time.append(el('b','','最近实质进展'),el('span','',line.progressLabel||(line.progressAt||'时间未核实，暂置后')));status.append(time,el('span','badge '+line.status,LABELS[line.status]||'未复核'));h.append(title,status);a.append(h);
 const tracks=el('div','tracks');tracks.append(makeTrack(line,'完整规划','全程路线',line.stages||[],line.roadmapBasis||line.stageBasis||'完整阶段划分尚未核实'));
 const steps=Array.isArray(line.steps)&&line.steps.length?line.steps:[{label:'步骤尚未核实',state:'unknown',detail:'未将已有局部测试外推为阶段完成。'}];tracks.append(makeTrack(line,'当前阶段',line.stepsTitle||'本阶段步骤',steps,line.stepsBasis||'步骤状态仅按现有证据记录。','steps'));a.append(tracks);
 const c=el('div','current-line');c.append(el('b','','当前'),document.createTextNode(line.current));a.append(c);
 const work=el('div','work');for(const [label,value,cls]of [['处理问题',line.issue,'issue'],['下一步',line.next,'']]){const row=el('div','work-item '+cls);row.append(el('span','label',label),el('p','',value));work.append(row)}a.append(work);
 const hasPrivate=!DATA.publicView&&(line.commit||(line.evidence||[]).length);
 if(hasPrivate){const f=el('details','foot');const sum=el('summary');if(line.commit){const commit=el('span');commit.append(document.createTextNode('本地提交 '),el('code','',line.commit));sum.append(commit)}sum.append(el('span','','核对：'+(line.checkedAt||'未核验')));f.append(sum);const sources=el('ul','sources');for(const e of line.evidence||[]){const li=el('li');li.append(document.createTextNode(e.label+(e.path?' · ':'')));if(e.path)li.append(el('code','',e.path));sources.append(li)}if(!(line.evidence||[]).length)sources.append(el('li','','暂无本轮可核验的来源记录。'));f.append(sources);a.append(f)}else{a.append(el('div','foot foot-static','核对：'+(line.checkedAt||'未核验')+' · '+(DATA.publicView?'公开摘要，已省略内部证据':'暂无可展示证据')))}
 return a
}
function render(){const shown=lines.filter(x=>(filter==='all'||x.status===filter)&&(!query||JSON.stringify(x).toLowerCase().includes(query)));const host=document.getElementById('cards');host.replaceChildren(...shown.map(card));document.getElementById('empty').style.display=shown.length?'none':'block';document.getElementById('count').textContent='显示 '+shown.length+' / '+lines.length+' 条线'}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});render();
</script></body></html>
