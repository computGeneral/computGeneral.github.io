---
layout: default
---
<a class="back-link" href="{{ '/' | append: page.category | append: '/' | relative_url }}">‹ {% if page.category == 'computing' %}General Computing{% else %}General Rendering{% endif %}</a>
<article class="post-content">
  <div class="blog-heading"><h1>{{ page.title | escape }}</h1><a class="action-link" href="{{ '/admin/' | relative_url }}#/collections/{{ page.category }}/entries/{{ page.path | split: "/" | last | remove: ".md" | uri_escape }}">Edit</a></div>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.author %} · {{ page.author | escape }}{% endif %}</p>
  {{ content }}
</article>
