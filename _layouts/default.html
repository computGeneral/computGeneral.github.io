<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/img/cg-icon.svg" | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home"><img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" width="320" height="90"></a>
    </header>
    <main id="main">{{ content }}</main>
    <footer>© {{ 'now' | date: '%Y' }} {{ site.title }}</footer>
  </div>
</body>
</html>
