<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页"><img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" width="320" height="90"></a>
      <nav aria-label="主导航"><a href="#about">关于</a><a href="#projects">项目</a><a href="#contact">联系</a></nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span><span>保持好奇，持续创造。</span></footer>
  </div>
</body>
</html>
