title: ComputGeneral
logo: /assets/img/computgeneral.svg
description: An organization in the making. A space for ideas, projects, and collaboration.
lang: en
url: https://www.computgeneral.com
profile_url: https://github.com/computGeneral
internal_url: https://lns.computgeneral.com:5644
theme: jekyll-theme-minimal
exclude:
  - README.md
  - docs
  - script
  - oauth
  - tests
  - package.json
collections:
  computing:
    output: true
    permalink: /computing/:name/
  rendering:
    output: true
    permalink: /rendering/:name/
defaults:
  - scope:
      path: ""
      type: computing
    values:
      layout: post
      category: computing
  - scope:
      path: ""
      type: rendering
    values:
      layout: post
      category: rendering
